<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brone — переезд</title>
  <!-- Fallback, если JS отключён: универсальная ссылка (работает и в РФ). -->
  <meta http-equiv="refresh" content="3; url=https://second.aitbek.dev/" />
  <style>
    html,body{height:100%;margin:0}
    body{display:flex;align-items:center;justify-content:center;
      font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#0f1117;color:#e7e9ee}
    .card{max-width:420px;padding:28px 24px;text-align:center;background:#171a23;
      border:1px solid #232838;border-radius:16px}
    h1{font-size:1.15rem;margin:0 0 8px}
    p{font-size:.9rem;color:#9aa3b2;line-height:1.5;margin:0 0 18px}
    a.btn{display:block;margin:8px 0;padding:11px 14px;border-radius:10px;
      text-decoration:none;font-weight:600;font-size:.92rem}
    .primary{background:#3b82f6;color:#fff}
    .ghost{background:#202637;color:#cfd6e4}
    .muted{font-size:.78rem;color:#6b7385;margin-top:14px}
  </style>
</head>
<body>
  <div class="card">
    <h1>Этот адрес устарел</h1>
    <p id="msg">Перенаправляем на актуальный сайт…</p>
    <a class="btn primary" href="https://second.aitbek.dev/">🇷🇺 Открыть (для России)</a>
    <a class="btn ghost" href="https://brone.vercel.app/">🌍 Открыть (вне России)</a>
    <div class="muted">Если ничего не произошло — нажмите кнопку выше.</div>
  </div>
  <script>
    (function () {
      // Российские таймзоны → reg.ru-зеркало (работает и в РФ, и вне её).
      // Остальные → Vercel.
      var ruZones = [
        'Europe/Moscow','Europe/Kaliningrad','Europe/Samara','Europe/Volgograd',
        'Europe/Astrakhan','Europe/Saratov','Europe/Ulyanovsk','Europe/Kirov',
        'Asia/Yekaterinburg','Asia/Omsk','Asia/Novosibirsk','Asia/Barnaul',
        'Asia/Tomsk','Asia/Novokuznetsk','Asia/Krasnoyarsk','Asia/Irkutsk',
        'Asia/Chita','Asia/Yakutsk','Asia/Khandyga','Asia/Vladivostok',
        'Asia/Ust-Nera','Asia/Magadan','Asia/Sakhalin','Asia/Srednekolymsk',
        'Asia/Kamchatka','Asia/Anadyr'
      ];
      var tz = '';
      try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
      var target = ruZones.indexOf(tz) !== -1 ? 'https://second.aitbek.dev/' : 'https://brone.vercel.app/';
      location.replace(target);
    })();
  </script>
</body>
</html>
